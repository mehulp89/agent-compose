name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AgentCompose. Remove credentials and personal prompt data.
  - type: input
    id: version
    attributes:
      label: AgentCompose version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include code, steps, or a small public repository.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Android version, device/emulator, Kotlin, Compose, AGP, and JDK.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secret key or private user data.
          required: true
